<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Futuristic AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
  
  <div class="chat-header">
    🤖 Gemini AI Assistant
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
